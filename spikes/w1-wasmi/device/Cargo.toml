# SPDX-License-Identifier: Apache-2.0
# Spike W1 device runner — throwaway. See ../README.md §"Running on device".
#
# A library, not a binary. The board glue (entry point, clock, allocator,
# output transport) supplies four things listed in lib.rs and calls `run`.
# Keeping it a library is what lets it compile and be tested here, on a
# machine with no ESP32-P4 attached.
[package]
name    = "w1-device"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
wasmi = { version = "1.1", default-features = false }

[profile.release]
opt-level = "s"
lto       = true
panic     = "abort"
